name: Update Google Scholar Publications

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 10:00 北京时间自动运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 取代码，但不保留默认 Bot 凭证
      - uses: actions/checkout@v3
        with:
          persist-credentials: false      # <— 关键
    
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
    
      - name: Install Dependencies
        run: pip install beautifulsoup4 requests
    
      - name: Update README from Google Scholar
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: python scripts/update_scholar.py

    
      # 2. Commit & Push
      - name: Commit & Push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}       # 你的 PAT
        run: |
          git config user.name  "Bowen12137"
          git config user.email "arthur12137@gmail.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
    
          git add README.md
          git diff --cached --quiet && echo "✅ No changes" && exit 0
          git commit -m "📚 auto-update publications"
          git push origin main



